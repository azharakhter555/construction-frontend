<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%" style="background-color: #F8F9FA;">
  <defs>
    <!-- Gold Gradient -->
    <linearGradient id="goldGradDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4AF37" />
      <stop offset="50%" stop-color="#AA820A" />
      <stop offset="100%" stop-color="#8A6605" />
    </linearGradient>
    
    <!-- Gold Gradient for Star Facets -->
    <linearGradient id="goldFacetLightDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E8C860" />
      <stop offset="100%" stop-color="#AA820A" />
    </linearGradient>
    <linearGradient id="goldFacetDarkDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8A6605" />
      <stop offset="100%" stop-color="#543E02" />
    </linearGradient>
  </defs>

  <!-- HOUSE STRUCTURE -->
  <g>
    <!-- Roof Line & Walls -->
    <path d="M 400 50 L 210 190 L 250 190 L 250 300 L 280 300 L 280 137 L 400 50 Z" fill="#0E2A47" />
    <path d="M 400 50 L 590 190 L 550 190 L 550 300 L 520 300 L 520 95 L 480 95 L 480 108 L 400 50 Z" fill="#0E2A47" />
    <polygon points="400,50 210,190 250,220 400,110 550,220 590,190" fill="#0E2A47" />
    <rect x="250" y="195" width="30" height="105" fill="#0E2A47" />
    <rect x="520" y="195" width="30" height="105" fill="#0E2A47" />
    <rect x="488" y="75" width="28" height="40" fill="#0E2A47" />

    <!-- Inner Gold Roof Arch -->
    <path d="M 400 110 L 280 200 L 290 210 L 400 128 L 510 210 L 520 200 Z" fill="url(#goldGradDark)" />

    <!-- 4-Pane Window -->
    <g fill="#0E2A47">
      <rect x="370" y="127" width="26" height="26" rx="2" />
      <rect x="404" y="127" width="26" height="26" rx="2" />
      <rect x="370" y="161" width="26" height="26" rx="2" />
      <rect x="404" y="161" width="26" height="26" rx="2" />
    </g>
  </g>

  <!-- 3D GOLD STAR (CENTERED IN HOUSE) -->
  <g transform="translate(400, 235) scale(1.1)">
    <!-- Point 1 (Top) -->
    <polygon points="0,0 0,-48 14,-14" fill="url(#goldFacetLightDark)" />
    <polygon points="0,0 0,-48 -14,-14" fill="url(#goldFacetDarkDark)" />
    <!-- Point 2 (Right) -->
    <polygon points="0,0 46,-15 14,-14" fill="url(#goldFacetDarkDark)" />
    <polygon points="0,0 46,-15 23,17" fill="url(#goldFacetLightDark)" />
    <!-- Point 3 (Bottom Right) -->
    <polygon points="0,0 28,39 23,17" fill="url(#goldFacetDarkDark)" />
    <polygon points="0,0 28,39 0,22" fill="url(#goldFacetLightDark)" />
    <!-- Point 4 (Bottom Left) -->
    <polygon points="0,0 -28,39 0,22" fill="url(#goldFacetDarkDark)" />
    <polygon points="0,0 -28,39 -23,17" fill="url(#goldFacetLightDark)" />
    <!-- Point 5 (Left) -->
    <polygon points="0,0 -46,-15 -23,17" fill="url(#goldFacetDarkDark)" />
    <polygon points="0,0 -46,-15 -14,-14" fill="url(#goldFacetLightDark)" />
  </g>

  <!-- CENTERED BRAND NAME TEXT (FIVESTAR) -->
  <g font-family="&#39;Arial Black&#39;, &#39;Helvetica Neue&#39;, sans-serif" font-weight="900" font-size="92" letter-spacing="-1" text-anchor="middle">
    <text x="400" y="400">
      <tspan fill="#0E2A47">FIVE</tspan><tspan fill="url(#goldGradDark)">STAR</tspan>
    </text>
  </g>

  <!-- SUBTITLE TEXT -->
  <text x="400" y="455" font-family="&#39;Arial&#39;, &#39;Helvetica&#39;, sans-serif" font-weight="800" font-size="32" fill="#0E2A47" text-anchor="middle" letter-spacing="4">PROPERTY MAINTENANCE</text>
</svg>